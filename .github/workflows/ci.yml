name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.14"
  # The hooks are for the machine of the person who pushes. A runner has
  # no push to guard, and installing them there would point the runner at
  # a directory of hooks that nothing runs.
  HUSKY: "0"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The Rust lint compiles the whole crate, and the crate sits on top
      # of Tauri, which needs the glib and webkit development libraries to
      # build against. Without them the compile stops with a message about
      # a missing pkg-config file rather than about the code.
      - name: Install Linux dependencies
        shell: bash
        run: .github/scripts/install-linux-deps.sh libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      # The scripts are shell scripts, and a runner on Windows runs a step
      # in PowerShell by default, which cannot run them. This job runs on
      # Linux, but the shell is asked for anyway so that the rule the
      # workflow scanner checks stays true here too.
      - name: Lint the frontend
        shell: bash
        run: .github/scripts/lint-frontend.sh

      - name: Lint the Rust side
        shell: bash
        run: .github/scripts/lint-rust.sh

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      # Every place that carries the version has to carry the same one.
      # A tree whose declarations disagree would build an installer that
      # says one version and a package that says another, and the report
      # is what says which place is the odd one out.
      - name: Check the version declarations
        run: bun run version:report

      - name: Run tests
        run: bun run test

      - name: Build frontend
        run: bun run build

  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: .github/scripts/install-linux-deps.sh libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The icons are not in the repository. They are derived from one
      # picture when they are needed, and the Rust side of the app reads
      # the icon of the window into the binary, so a compile without them
      # fails.
      - name: Write the icons
        run: bun run scripts/generate-icons.ts

      - name: Run cargo tests
        working-directory: apps/desktop/src-tauri
        run: cargo test

  # The pages are compared, not the PDF bytes. The bytes differ between
  # operating systems because the PDF writer puts its own metadata into
  # the file, while the rendered pages are the same document.
  #
  # Typst rasterises with its own renderer rather than with the system's,
  # so the pages of the same document are the same everywhere, and the
  # comparison runs on every platform rather than on one.
  visual:
    name: Visual check on ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: .github/scripts/install-linux-deps.sh libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Write the icons
        run: bun run scripts/generate-icons.ts

      # Bash is asked for on purpose. A runner on Windows runs a step in
      # PowerShell by default, and PowerShell cannot run a shell script.
      - name: Compare the pages with the baselines
        shell: bash
        run: .github/scripts/visual-check.sh

  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: .github/scripts/install-linux-deps.sh libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the desktop app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          args: --no-bundle
