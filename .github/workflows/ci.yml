name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.14"
  # The Python version every job uses. It is pinned so the render stack is
  # the same everywhere.
  PYTHON_VERSION: "3.12"

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The tests run inside the render image, because the visual baselines
      # were produced by exactly this stack: the same Debian release, the
      # same Pango, the same WeasyPrint. Running them against the runner's
      # own libraries would compare the baselines with a slightly different
      # engine, which is a difference in the environment rather than in the
      # code.
      - name: Build the test image
        run: docker build -f apps/api/Dockerfile --target test -t yuemi-api:test .

      - name: Run the tests
        run: docker run --rm yuemi-api:test

  visual:
    name: Visual check on ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Pango is the layout engine behind WeasyPrint. It has to be installed
      # the way each platform's documentation describes, and the Python
      # process has to be told where its libraries live.
      - name: Install Pango on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b \
            libharfbuzz-subset0 libcairo2 libgdk-pixbuf-2.0-0 libffi8 \
            shared-mime-info

      - name: Install Pango on macOS
        if: runner.os == 'macOS'
        run: brew install pango || brew upgrade pango

      - name: Install Pango on Windows
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-pango

      # WeasyPrint loads Pango through CFFI, which needs to be told where the
      # libraries are on the platforms that do not have a standard search
      # path for them.
      - name: Point the loader at the libraries on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "WEASYPRINT_DLL_DIRECTORIES=${{ steps.msys2.outputs.msys2-location }}\\ucrt64\\bin" >> "$GITHUB_ENV"

      - name: Point the loader at the libraries on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "DYLD_FALLBACK_LIBRARY_PATH=/opt/homebrew/lib:/usr/local/lib" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      # The pages are compared, not the PDF bytes. The bytes differ between
      # operating systems because Pango writes its own metadata into the
      # file, while the rendered pages are the same document.
      - name: Render the reference document
        run: python scripts/render_pages.py tests/fixtures/reference .tmp-pages

      - name: Compare the pages with the baselines
        run: |
          python scripts/compare_pages.py \
            tests/visual/baseline/reference .tmp-pages \
            --tolerance 0.002

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Run tests
        run: bun run test

      - name: Build frontend
        run: bun run build

  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf xdg-utils

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Run cargo tests
        run: cargo test

  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf xdg-utils

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the desktop app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          args: --no-bundle

  render-image:
    name: Render service image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "${{ env.PYTHON_VERSION }}"

      - name: Build the image
        run: docker build -f apps/api/Dockerfile --target runtime -t yuemi-api:ci .

      - name: Smoke test the render service
        run: |
          # The port is read from the service's own code, so this job cannot
          # test a port the service does not listen on.
          port=$(python -c "import sys; sys.path.insert(0, 'apps/api'); from app.service import SERVICE_PORT; print(SERVICE_PORT)")
          docker run -d --name yuemi-api -p "$port:$port" yuemi-api:ci
          for attempt in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:$port/v1/health" > /dev/null; then
              echo "Service is up."
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Service did not become healthy in time."
              docker logs yuemi-api
              exit 1
            fi
            sleep 2
          done
          curl -fsS "http://127.0.0.1:$port/v1/health"
          echo
