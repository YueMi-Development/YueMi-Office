name: Release

# A release is built from a tag, and only from a tag. The tag names the
# version: `v1.0.0` for a release and `v1.0.0-beta` for a pre-release.
#
# The ordinary CI workflow builds the app on every push, but it builds no
# installers, because bundling is slow: a disk image on macOS, an
# installer and an MSI on Windows, three packages on Linux. That work
# belongs here, where it happens once per release.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A release that is already being built should not be stopped halfway.
  cancel-in-progress: false

env:
  BUN_VERSION: "1.3.14"
  # The hooks are for the machine of the person who pushes. A runner has
  # no push to guard, and installing them there would point the runner at
  # a directory of hooks that nothing runs.
  HUSKY: "0"

jobs:
  release:
    name: Prepare the release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - uses: actions/checkout@v7

      # The tag is the version. A tag that does not name a version is
      # refused here, with a message that says so, rather than being
      # discovered by the bundler on one of three runners.
      #
      # The tag is passed in through the environment rather than written
      # into a command, because a tag is not a safe thing to paste into
      # a shell.
      - name: Read the version from the tag
        id: version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: .github/scripts/version-from-tag.sh "$TAG"

      # The release is created once, here, and the platform jobs
      # upload into it. If each of them created it, they would race.
      # The release is fetched first when it already exists, so that a
      # re-run of a failed workflow adds to it rather than failing.
      - name: Create the release
        id: create
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: .github/scripts/create-release.sh "$TAG" "$VERSION" "$PRERELEASE"

  bundle:
    name: Bundle ${{ matrix.platform }}
    needs: release
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      # The committed lockfile is the one the tests ran against, so it is
      # installed as it is.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The version of a release is the version of its tag, so the tag's
      # version is written into the tree before the build. The script does
      # the work, because a workflow file is a list of steps and a step
      # that is forty lines of shell is not a step.
      #
      # The tag is passed in through the environment rather than written
      # into a command, because a tag is not a safe thing to paste into
      # a shell.
      - name: Set the version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: .github/scripts/apply-tag-version.sh "$TAG"

      # The lockfile records the version of the workspace packages, so it
      # is written again after the version has changed. The script writes
      # it too, and bun is run over it anyway, because bun is the one
      # that knows the shape of its own lockfile.
      - name: Update the lockfile
        run: bun install

      - name: Build the installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          # The release was made by the step above, so the action only
          # has to upload into it. The action creates a release itself
          # when it is given a tag, and the jobs doing that would race
          # each other.
          releaseId: ${{ needs.release.outputs.release_id }}
          # There is no updater keypair yet, so there is no updater
          # manifest to publish.
          uploadUpdaterJson: false
          # The bare executable is useful on its own, next to the
          # installers.
          uploadPlainBinary: true
          # The artifacts are on the run page as well as on the release.
          uploadWorkflowArtifacts: true

  linux:
    name: Bundle linux
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The AppImage is built by a tool that runs inside a FUSE mount, and
      # the webview and the tray icon need the libraries below.
      - name: Install Linux dependencies
        shell: bash
        run: .github/scripts/install-linux-deps.sh libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils file wget xz-utils fuse

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The version of a release is the version of its tag, so the tag's
      # version is written into the tree before the build. The script does
      # the work, because a workflow file is a list of steps and a step
      # that is forty lines of shell is not a step.
      - name: Set the version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: .github/scripts/apply-tag-version.sh "$TAG"

      - name: Update the lockfile
        run: bun install

      # An rpm cannot be built for a pre-release. Its version has to be
      # set while it is built, and the only version the bundler takes is
      # the one in the configuration, which has to be a plain semver
      # version. So the rpm is left out for a pre-release and built for a
      # release.
      #
      # The flag comes in through the environment rather than through the
      # command, because the shell reads the command before the script
      # does.
      - name: Choose the packages to build
        id: packages
        shell: bash
        env:
          PRERELEASE: ${{ needs.release.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            echo "bundles=deb,appimage" >> "$GITHUB_OUTPUT"
          else
            echo "bundles=deb,appimage,rpm" >> "$GITHUB_OUTPUT"
          fi

      # The Debian package is built by the bundler and then rewritten,
      # because the bundler puts the version of the app into the control
      # file of the package and Debian reads a pre-release identifier in
      # that field as a revision that sorts after the finished release.
      - name: Build the packages
        shell: bash
        env:
          BUNDLES: ${{ steps.packages.outputs.bundles }}
        run: .github/scripts/build-linux-packages.sh "$BUNDLES"

      # The upload is done here rather than by the Tauri action, because
      # the package has to be rewritten before it is uploaded.
      - name: Upload the packages
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: .github/scripts/upload-release-files.sh "$TAG" apps/desktop/src-tauri/target/release/bundle apps/desktop/src-tauri/target/release/yuemi