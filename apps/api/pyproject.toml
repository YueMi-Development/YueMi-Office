[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yuemi-api"
version = "0.1.0"
description = "Render service for the yuemi Markdown document studio"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  # WeasyPrint and pydyf are pinned exactly: they decide the bytes of the
  # PDF, so a version bump would change every visual baseline.
  "weasyprint==70.0",
  "pydyf==0.13.0",
  "markdown-it-py>=3.0",
  "jinja2>=3.1",
  "pypdf>=4.0",
  # The assistant looks at the rendered pages, so the PDF is rasterised.
  # This is separate from the renderer on purpose: the renderer decides the
  # bytes of the PDF, and a bump here must not change them.
  "pypdfium2>=4.30",
  "fonttools[brotli]==4.68.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  # The linter and the formatter of the service. They are pinned so a
  # new release cannot change what the lint says about a line that is
  # already written.
  "ruff==0.17.4",
  # PyMuPDF 2.x pulls in onnxruntime, which is a heavy dependency that the
  # visual tests do not need.
  "pymupdf==1.28.2",
  "numpy==2.5.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

# The lint rules for the render service.
#
# The set is the errors of flake8 — the mistakes that break the program —
# together with the import order and the modernisation of the annotations.
# The blind exception is not in the set: the renderer and the warning
# collector have to survive a document that is damaged, and the places that
# catch it say so where they do it.
[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
docstring-code-format = true
