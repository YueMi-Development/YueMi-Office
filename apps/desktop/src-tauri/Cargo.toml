[package]
name = "app"
version = "0.2.0-alpha"
description = "yuemi, an AI-assisted Typst document studio"
authors = ["yuemi"]
license = "FSL-1.1-ALv2"
repository = "https://github.com/YueMi-Development/YueMi-Office"
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
base64 = "0.23"
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
# The provider calls are made from Rust, so the webview never holds an API
# key and never makes a cross-origin request. TLS is rustls with the ring
# provider, because aws-lc-rs needs a C toolchain on the Windows and macOS
# runners.
reqwest = { version = "0.13", default-features = false, features = [
  "rustls-no-provider",
  "json",
  "stream",
  "charset",
  "http2",
] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
futures-util = "0.3"
dirs = "7"
# The timer is used to stop a provider that never answers from leaving the
# settings dialog waiting for ever.
tokio = { version = "1", features = ["time", "rt"] }
typst = "0.15.1"
typst-layout = "0.15.1"
typst-pdf = "0.15.1"
typst-render = "0.15.1"
typst-assets = { version = "0.15.1", features = ["fonts"] }
woff2-patched = "0.4.0"
similar = "2.7.0"
bytes = "1"
tiny-skia = { version = "0.12", features = ["png-format"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# The visual check reads the baseline pages to compare them with a render.
png = "0.18"
