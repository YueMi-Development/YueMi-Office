[package]
name = "app"
version = "0.1.0"
description = "yuemi, an AI-assisted Markdown document studio"
authors = ["yuemi"]
license = "FSL-1.1-ALv2"
repository = "https://github.com/YueMi-Development/YueMi-Office"
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
base64 = "0.22"
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
# The provider calls are made from Rust, so the webview never holds an API
# key and never makes a cross-origin request. TLS is rustls with the ring
# provider, because aws-lc-rs needs a C toolchain on the Windows and macOS
# runners.
reqwest = { version = "0.13", default-features = false, features = [
  "rustls-no-provider",
  "json",
  "stream",
  "charset",
  "http2",
] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
futures-util = "0.3"
dirs = "7"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
