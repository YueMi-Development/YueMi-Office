[package]
name = "app"
version = "0.1.0"
description = "YueMi Office, an AI-assisted Markdown document studio"
authors = ["YueMi"]
license = "FSL-1.1-ALv2"
repository = "https://github.com/YueMi-Development/YueMi-Office"
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
base64 = "0.22"
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"

[dev-dependencies]
tempfile = "3"
